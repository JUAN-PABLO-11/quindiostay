# Base de datos Oracle para desarrollo local.
# Arrancar:  docker compose up -d
# Ver si ya está lista (esperar "DATABASE IS READY TO USE!"):  docker compose logs -f oracle
# Apagar:    docker compose stop      (los datos se conservan en el volumen)
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-quindiostay
    network_mode: bridge
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: Admin123
      APP_USER: quindiostay
      APP_USER_PASSWORD: quindiostay
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data: